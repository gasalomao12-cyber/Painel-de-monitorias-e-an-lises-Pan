# PX Monitorias — Nginx na VM
# Troque px.EMPRESA.com.br / px-api.EMPRESA.com.br e os caminhos dos certificados.
# Copie para /etc/nginx/sites-available/ e ative com um link em sites-enabled.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name px.EMPRESA.com.br px-api.EMPRESA.com.br;
  return 301 https://$host$request_uri;
}

# Telas (arquivos estáticos da pasta public/)
server {
  listen 443 ssl http2;
  server_name px.EMPRESA.com.br;

  ssl_certificate     /etc/ssl/px/fullchain.pem;
  ssl_certificate_key /etc/ssl/px/privkey.pem;

  root /opt/px-app/public;
  index index.html;

  # version.json e o service worker nunca ficam em cache: a plataforma avisa quando há versão nova
  location = /version.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
}

# API, login, áudios e tempo real (Supabase self-hosted: Kong em 127.0.0.1:8000)
server {
  listen 443 ssl http2;
  server_name px-api.EMPRESA.com.br;

  ssl_certificate     /etc/ssl/px/fullchain.pem;
  ssl_certificate_key /etc/ssl/px/privkey.pem;

  # áudios de até 50 MB e importação de planilhas
  client_max_body_size 60m;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # WebSocket do tempo real
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Supabase Studio (painel do banco) fica fechado para a rede de usuários
  location /project/ { deny all; }
}
