# PX Monitorias — Nginx na frente do servidor (HTTPS).
# Troque px.EMPRESA.com.br e os caminhos dos certificados. Copie para /etc/nginx/sites-available/ e ative.

server {
  listen 80;
  server_name px.EMPRESA.com.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name px.EMPRESA.com.br;

  ssl_certificate     /etc/ssl/px/fullchain.pem;
  ssl_certificate_key /etc/ssl/px/privkey.pem;

  # áudios de até 50 MB e importação de planilhas
  client_max_body_size 60m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Tempo real (Server-Sent Events): conexão longa e sem buffer
  location = /realtime {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Telas, API, login e áudios
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
}
